name: Paper-Workbench CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paper-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WB_PROVIDER_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev,figures,evaluation]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install offline math renderer
        working-directory: src/workbench/math_runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ruff
        run: python -m ruff check src/
      - name: Pytest
        run: python -m pytest
