[project]
name = "paper-workbench"
version = "0.1.0"
description = "Evidence-controlled general research workbench: research graph, grounded dialogue, provenance-preserving authoring and export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "vercel>=0.5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pypdf>=6.0",
    "PyJWT[crypto]>=2.8",
    "bcrypt>=4.1",
    "python-docx>=1.1",
    "alembic>=1.13",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Fixed wire protocol for supervised offline evaluation; review before upgrading.
evaluation = ["openai==2.46.0"]
research-semantic = ["onnxruntime==1.30.0", "tokenizers==0.23.2", "numpy>=1.21.6"]
# Pinned local ChatGPT runtime; upgraded only after a capability/security review.
codex-local = ["openai-codex==0.160.1", "tiktoken>=0.12,<1"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Typeset PDF export via WeasyPrint. Windows library use also requires Pango; the
# export pipeline performs a real render probe and records any deterministic fallback.
pdf = ["weasyprint>=60"]
# Figure/table rendering (matplotlib + numpy). Render functions raise a clear error if absent.
figures = ["matplotlib>=3.8"]
# Optional local OCR. PyMuPDF delegates OCR to Tesseract and therefore also needs
# Tesseract language data on the host. The application never installs or invokes it
# unless PDF mode is auto/ocr and a page needs it.
ocr = ["pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench = [
    "math_runtime/*.cjs",
    "math_runtime/package*.json",
    "schemas/jats_1_3_archiving/*",
    "schemas/jats_1_3_archiving/iso8879/*",
    "schemas/jats_1_3_archiving/iso9573-13/*",
    "schemas/jats_1_3_archiving/mathml/*",
    "schemas/jats_1_3_archiving/xmlchars/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Pydantic dependency-injection markers are meant to be call defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path",
    "pydantic.Field",
]
