[project]
name = "paper-workbench"
version = "0.1.0"
description = "Evidence-controlled general research workbench: research graph, grounded dialogue, provenance-preserving authoring and export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pypdf>=6.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-docx>=1.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Typeset PDF export via WeasyPrint. Requires GTK/Pango native libs (absent on this
# Windows box); the export pipeline probes availability and falls back to the built-in
# deterministic renderer when they are missing.
pdf = ["weasyprint>=60"]
# Strict JATS validation and richer XML handling.
xml = ["lxml>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
