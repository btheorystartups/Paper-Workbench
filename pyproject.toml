[project]
name = "paper-workbench"
version = "0.1.0"
description = "Evidence-controlled general research workbench: research graph, grounded dialogue, provenance-preserving authoring and export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pypdf>=6.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-docx>=1.1",
    "alembic>=1.13",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Typeset PDF export via WeasyPrint. Requires GTK/Pango native libs (absent on this
# Windows box); the export pipeline probes availability and falls back to the built-in
# deterministic renderer when they are missing.
pdf = ["weasyprint>=60"]
# Figure/table rendering (matplotlib + numpy). Render functions raise a clear error if absent.
figures = ["matplotlib>=3.8"]
# Optional local OCR. PyMuPDF delegates OCR to Tesseract and therefore also needs
# Tesseract language data on the host. The application never installs or invokes it
# unless PDF mode is auto/ocr and a page needs it.
ocr = ["pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Pydantic dependency-injection markers are meant to be call defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path",
    "pydantic.Field",
]
